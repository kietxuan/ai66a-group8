# Explicitly isolated test stack: no real .env, bind-mounted data, or production volumes.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: planify_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: planify_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U planify_test -d planify_test]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://planify_test:test-only-password@db:5432/planify_test
      TEST_DATABASE_URL: postgresql+asyncpg://planify_test:test-only-password@db:5432/planify_test
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: isolated-test-signing-key-not-for-real-deployment-2026
      ADMIN_PASSWORD: ""
      AI_API_KEY: ""
      API_KEY: ""
      SMTP_PASSWORD: ""
      SCHEDULER_ENABLED: "false"
    volumes:
      - ./backend:/app
      - .:/workspace
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test: [CMD-SHELL, "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:13000:80"
    depends_on: [backend]
