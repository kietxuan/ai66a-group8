services:
  - type: web
    name: nhip-todo-calendar
    runtime: python
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start.sh
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: AI_TIMEOUT_SECONDS
        value: '20'
      - key: AI_MAX_COMPLETION_TOKENS
        value: '1024'
      - key: CHAT_EXECUTION_ENABLED
        value: 'true'
