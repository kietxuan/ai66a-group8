name: MVP checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: todo_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U todo -d todo_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://todo:test-only-password@localhost:5432/todo_ci_dev
      TEST_DATABASE_URL: postgresql+psycopg://todo:test-only-password@localhost:5432/todo_ci_test
      JWT_SECRET_KEY: ci-only-secret-which-is-at-least-thirty-two-characters
      GROQ_API_KEY: ''
      GROQ_MODEL: openai/gpt-oss-20b
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.lock.txt
      - run: python -m pip install pip==26.2.1 setuptools==83.0.0
      - run: pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q app ../scripts
      - run: python ../scripts/check_project.py
      - run: bash -n ../scripts/build.sh ../scripts/start.sh
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
